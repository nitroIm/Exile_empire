<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; font-family: -apple-system, sans-serif; color: #fff; height: 100vh; width: 100vw; }

#splash { position: fixed; inset: 0; z-index: 100; }
#splash.hidden { display: none; }
#splash img { width: 100%; height: 100%; object-fit: cover; }

#menu { position: fixed; inset: 0; display: none; }
#menu.visible { display: block; }

#menu img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

#menu .dark {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
}

#menu .buttons {
  position: absolute; bottom: 50px; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: 0 30px; z-index: 5;
}

.menu-btn {
  width: 100%; max-width: 320px; padding: 18px; margin-bottom: 14px;
  font-size: 16px; letter-spacing: 2px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #0a1430, #102850);
  border: 2px solid #00e0d0; border-radius: 14px; text-align: center;
}
.menu-btn.gold { border-color: #d4a020; }
</style>
</head>
<body>

<div id="splash">
  <img src="assets/splash.PNG">
</div>

<div id="menu">
  <img class="bg" src="assets/Planet.PNG">
  <div class="dark"></div>
  <div class="buttons">
    <div class="menu-btn gold">▶ PLAY</div>
    <div class="menu-btn">PROFILE</div>
    <div class="menu-btn">SHOP</div>
    <div class="menu-btn">SETTINGS</div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('menu').classList.add('visible');
  }, 3000);
});
</script>
</body>
</html>
