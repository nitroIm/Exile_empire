<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
body { background: #0a0e1a; overflow: hidden; font-family: -apple-system, sans-serif; color: #fff; height: 100vh; width: 100vw; }

/* ЗАСТАВКА */
#splash { position: fixed; inset: 0; z-index: 100; transition: opacity 0.6s ease; }
#splash.hidden { opacity: 0; pointer-events: none; }
#splash img { width: 100%; height: 100%; object-fit: cover; }

/* МЕНЮ */
#menu {
  position: fixed; inset: 0; display: none;
  flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 40px 30px 60px;
  z-index: 50;
}
#menu.visible { display: flex; }

#menu-bg {
  position: absolute; inset: 0; z-index: -1;
}
#menu-bg img { width: 100%; height: 100%; object-fit: cover; }
#menu-bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,14,26,0.2) 0%, rgba(10,14,26,0.85) 100%);
}

.menu-btn {
  width: 100%; max-width: 320px; padding: 18px; margin-bottom: 14px;
  font-size: 16px; letter-spacing: 2px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #0a1430, #102850);
  border: 2px solid #00e0d0; border-radius: 14px; text-align: center;
  box-shadow: 0 0 12px rgba(0, 224, 208, 0.3);
}
.menu-btn.gold { border-color: #d4a020; box-shadow: 0 0 12px rgba(212, 160, 32, 0.4); }
</style>
</head>
<body>

<!-- ЗАСТАВКА -->
<div id="splash">
  <img src="assets/splash.PNG" alt="Exile Empire">
</div>

<!-- МЕНЮ с фоном Planet.PNG -->
<div id="menu">
  <div id="menu-bg">
    <img src="assets/Planet.PNG" alt="">
  </div>
  <div class="menu-btn gold" onclick="startGame()">▶ PLAY</div>
  <div class="menu-btn" onclick="alert('В разработке')">PROFILE</div>
  <div class="menu-btn" onclick="alert('В разработке')">SHOP</div>
  <div class="menu-btn" onclick="alert('В разработке')">SETTINGS</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('menu').classList.add('visible');
  }, 3000);
});

function startGame() {
  if (tg) tg.HapticFeedback?.impactOccurred('medium');
  alert('Скоро здесь будет игра!');
}
</script>
</body>
</html>
