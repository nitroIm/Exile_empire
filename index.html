<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exile's Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        #error {
            position: fixed; top: 10px; left: 10px; right: 10px;
            background: rgba(255,0,0,0.9); color: white; padding: 10px;
            font-family: monospace; font-size: 14px; z-index: 100;
            display: none; word-break: break-all;
        }
    </style>
</head>
<body>
<div id="error"></div>
<canvas id="game"></canvas>
<script>
    const errorBox = document.getElementById('error');
    function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.textContent = msg;
    }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const img = new Image();

    img.onload = () => { resize(); };
    img.onerror = () => {
        showError('Картинка не найдена! Проверь папку Asset и имя файла.');
    };

    img.src = 'Asset/map_01.PNG';

    let camera = { x: 0, y: 0, zoom: 0.4 };
    let lastTouch = null;

    const COLS = 8;
    const ROWS = 8;
    const TILE = 1024;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        draw();
    }

    function draw() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        if (!img.complete || img.naturalWidth === 0) return;

        ctx.save();
        ctx.translate(w / 2 + camera.x, h / 2 + camera.y);
        ctx.rotate(Math.PI / 4);
        ctx.scale(camera.zoom, camera.zoom * 0.5);

        const offsetX = -(COLS * TILE) / 2;
        const offsetY = -(ROWS * TILE) / 2;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                ctx.drawImage(img, offsetX + c * TILE, offsetY + r * TILE, TILE, TILE);
            }
        }

        ctx.restore();
    }

    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && lastTouch) {
            camera.x += e.touches[0].clientX - lastTouch.x;
            camera.y += e.touches[0].clientY - lastTouch.y;
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            draw();
        }
    });

    canvas.addEventListener('touchend', () => { lastTouch = null; });

    window.addEventListener('resize', resize);

    if (window.Telegram && window.Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    }
</script>
</body>
</html>
