<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="splash">
  <img src="assets/splash.PNG" alt="splash">
</div>

<div id="menu">
  <img class="bg" src="assets/Planet.PNG" alt="bg">
  <div class="dark"></div>
  <div class="buttons">
    <div class="menu-btn gold" onclick="startGame()">PLAY</div>
    <div class="menu-btn">PROFILE</div>
    <div class="menu-btn">SHOP</div>
    <div class="menu-btn">SETTINGS</div>
  </div>
</div>

<div id="game">
  <div id="world"></div>
  <div id="resources">
    <span>METAL <span id="metal">0</span></span>
    <span>CRYSTAL <span id="crystal">0</span></span>
    <span>STARS <span id="stars">0</span></span>
  </div>
  <div id="bottom-bar">
    <div class="bottom-btn gold">BUILD</div>
    <div class="bottom-btn">FIGHT</div>
    <div class="bottom-btn">SCIENCE</div>
    <div class="bottom-btn">FLEET</div>
  </div>
</div>

<script src="js/game.js"></script>
<script type="module" src="js/firebase.js"></script>
</body>
</html>
