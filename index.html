<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; font-family: -apple-system, sans-serif; color: #fff; height: 100vh; width: 100vw; }

#splash { position: fixed; inset: 0; z-index: 100; }
#splash.hidden { display: none; }
#splash img { width: 100%; height: 100%; object-fit: cover; }

#menu { position: fixed; inset: 0; display: none; }
#menu.visible { display: block; }
#menu img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#menu .dark { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%); }
#menu .buttons { position: absolute; bottom: 50px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; padding: 0 30px; z-index: 5; }

.menu-btn { width: 100%; max-width: 320px; padding: 18px; margin-bottom: 14px; font-size: 16px; letter-spacing: 2px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #0a1430, #102850); border: 2px solid #00e0d0; border-radius: 14px; text-align: center; }
.menu-btn.gold { border-color: #d4a020; }

#game { position: fixed; inset: 0; display: none; overflow: hidden; }
#game.visible { display: block; }

#world { position: absolute; width: 4096px; height: 4096px; top: 0; left: 0; }
#world img { width: 100%; height: 100%; display: block; }

#resources { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 15px; background: rgba(10,14,26,0.85); font-size: 14px; z-index: 10; }

#bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 12px; background: rgba(10,14,26,0.85); z-index: 10; }
.bottom-btn { flex: 1; padding: 14px 8px; margin: 0 4px; font-size: 12px; color: #fff; text-align: center; background: linear-gradient(135deg, #0a1430, #102850); border: 2px solid #00e0d0; border-radius: 12px; }
.bottom-btn.gold { border-color: #d4a020; }
</style>
</head>
<body>

<div id="splash">
  <img src="assets/splash.PNG">
</div>

<div id="menu">
  <img class="bg" src="assets/Planet.PNG">
  <div class="dark"></div>
  <div class="buttons">
    <div class="menu-btn gold" onclick="startGame()">▶ PLAY</div>
    <div class="menu-btn">PROFILE</div>
    <div class="menu-btn">SHOP</div>
    <div class="menu-btn">SETTINGS</div>
  </div>
</div>

<div id="game">
  <div id="world">
    <img src="assets/map_01.PNG">
  </div>
  <div id="resources">
    <span>🪙 0</span>
    <span>💎 0</span>
    <span>⭐ 0</span>
  </div>
  <div id="bottom-bar">
    <div class="bottom-btn gold">🏗 СТРОИТЬ</div>
    <div class="bottom-btn">⚔️ БОЙ</div>
    <div class="bottom-btn">🔬 НАУКА</div>
    <div class="bottom-btn">🚀 ФЛОТ</div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('menu').classList.add('visible');
  }, 3000);
});

window.startGame = function() {
  document.getElementById('menu').classList.remove('visible');
  document.getElementById('game').classList.add('visible');
  initMapDrag();
};

function initMapDrag() {
  const world = document.getElementById('world');
  let startX = 0, startY = 0, worldX = 0, worldY = 0, drag = false;

  worldX = -(4096 - window.innerWidth) / 2;
  worldY = -(4096 - window.innerHeight) / 2;
  world.style.transform = `translate(${worldX}px, ${worldY}px)`;

  world.addEventListener('touchstart', (e) => {
    drag = true;
    startX = e.touches[0].clientX - worldX;
    startY = e.touches[0].clientY - worldY;
  });

  world.addEventListener('touchmove', (e) => {
    if (!drag) return;
    e.preventDefault();
    worldX = e.touches[0].clientX - startX;
    worldY = e.touches[0].clientY - startY;
    clamp();
    world.style.transform = `translate(${worldX}px, ${worldY}px)`;
  });

  world.addEventListener('touchend', () => { drag = false; });

  function clamp() {
    if (worldX > 0) worldX = 0;
    if (worldX < -(4096 - window.innerWidth)) worldX = -(4096 - window.innerWidth);
    if (worldY > 0) worldY = 0;
    if (worldY < -(4096 - window.innerHeight)) worldY = -(4096 - window.innerHeight);
  }
}
</script>
</body>
</html>
