<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Exile Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e1a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            height: 100vh;
            width: 100vw;
        }

        /* Экран заставки */
        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            z-index: 100;
            transition: opacity 0.6s ease;
        }

        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splash img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        /* Пульсирующий загрузчик поверх заставки */
        #loadingBar {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 420px;
            z-index: 101;
            animation: pulse 1.6s ease-in-out infinite;
        }

        #loadingBar img {
            width: 100%;
            height: auto;
            display: block;
            position: relative;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }

        /* Текст «Loading…» под баром */
        #loadingText {
            position: absolute;
            bottom: 2.5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 2px;
            color: #00e0d0;
            text-shadow: 0 0 8px rgba(0, 224, 208, 0.7);
            z-index: 101;
        }

        /* Главное меню */
        #menu {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(180deg, #0a0e1a 0%, #0d1b3a 100%);
            padding: 40px 30px;
        }

        #menu.visible {
            display: flex;
        }

        #menu h1 {
            font-size: 28px;
            letter-spacing: 4px;
            color: #d4a020;
            text-shadow: 0 0 12px rgba(0, 224, 208, 0.6);
            margin-bottom: 30px;
            text-align: center;
        }

        .menu-btn {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #0a1430, #102850);
            border: 2px solid #00e0d0;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 12px rgba(0, 224, 208, 0.3);
        }

        .menu-btn:active {
            transform: scale(0.97);
            box-shadow: 0 0 20px rgba(0, 224, 208, 0.7);
        }

        .menu-btn.gold {
            border-color: #d4a020;
            box-shadow: 0 0 12px rgba(212, 160, 32, 0.4);
        }
    </style>
</head>
<body>

    <!-- ЗАСТАВКА -->
    <div id="splash">
        <img src="assets/splash.png" alt="Exile Empire">
        <div id="loadingBar">
            <img src="assets/bar.png" alt="loading">
        </div>
        <div id="loadingText">LOADING…</div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu">
        <h1>EXILE EMPIRE</h1>
        <div class="menu-btn gold" onclick="startGame()">▶ PLAY</div>
        <div class="menu-btn" onclick="alert('Профиль в разработке')">PROFILE</div>
        <div class="menu-btn" onclick="alert('Магазин в разработке')">SHOP</div>
        <div class="menu-btn" onclick="alert('Настройки в разработке')">SETTINGS</div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Показать меню после «загрузки»
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden');
                document.getElementById('menu').classList.add('visible');
            }, 3000); // 3 секунды заставки
        });

        // Кнопка PLAY
        function startGame() {
            if (tg) tg.HapticFeedback?.impactOccurred('medium');
            alert('Скоро здесь будет игра!');
        }
    </script>
</body>
</html>
