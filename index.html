<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
body { background: #0a0e1a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; height: 100vh; width: 100vw; }

#splash {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: #0a0e1a; z-index: 100; transition: opacity 0.6s ease;
  animation: breathe 2s ease-in-out infinite;
}
#splash.hidden { opacity: 0; pointer-events: none; }
#splash img { width: 100%; height: 100%; object-fit: cover; }

@keyframes breathe {
  0%, 100% { filter: brightness(0.9); }
  50%      { filter: brightness(1.15); }
}

#menu {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  background: linear-gradient(180deg, #0a0e1a 0%, #0d1b3a 100%);
  padding: 40px 30px;
}
#menu.visible { display: flex; }
#menu h1 {
  font-size: 28px; letter-spacing: 4px; color: #d4a020;
  text-shadow: 0 0 12px rgba(0, 224, 208, 0.6);
  margin-bottom: 30px; text-align: center;
}
.menu-btn {
  width: 100%; max-width: 320px; padding: 18px;
  font-size: 16px; letter-spacing: 2px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #0a1430, #102850);
  border: 2px solid #00e0d0; border-radius: 14px; text-align: center;
  box-shadow: 0 0 12px rgba(0, 224, 208, 0.3); transition: transform 0.15s;
}
.menu-btn:active { transform: scale(0.97); }
.menu-btn.gold { border-color: #d4a020; box-shadow: 0 0 12px rgba(212, 160, 32, 0.4); }
</style>
</head>
<body>

<div id="splash">
  <img src="https://nitroim.github.io/Exile_empire/assets/splash.PNG" alt="Exile Empire">
</div>

<div id="menu">
  <h1>EXILE EMPIRE</h1>
  <div class="menu-btn gold" onclick="startGame()">▶ PLAY</div>
  <div class="menu-btn" onclick="alert('В разработке')">PROFILE</div>
  <div class="menu-btn" onclick="alert('В разработке')">SHOP</div>
  <div class="menu-btn" onclick="alert('В разработке')">SETTINGS</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('menu').classList.add('visible');
  }, 3000);
});

function startGame() {
  if (tg) tg.HapticFeedback?.impactOccurred('medium');
  alert('Скоро здесь будет игра!');
}
</script>
</body>
</html>
