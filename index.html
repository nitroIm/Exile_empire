<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест карты</title>
</head>
<body style="margin:0; background:#222; color:#0f0; font-family:monospace; font-size:20px; padding:20px;">
    <div id="status">Загрузка...</div>
    <img id="test" style="max-width:100%; margin-top:20px; display:block;">

<script>
    const status = document.getElementById('status');
    const img = document.getElementById('test');

    // Пробуем разные варианты имени
    const names = ['map_01.PNG', 'map_01.png', 'map_01.jpg', 'map_01.jpeg', 'map_01.webp'];
    let index = 0;

    function tryNext() {
        if (index >= names.length) {
            status.textContent = '❌ НИ ОДИН ФАЙЛ НЕ НАЙДЕН. Проверь имена: ' + names.join(', ');
            return;
        }
        const name = names[index];
        status.textContent = '⏳ Пробую: ' + name;
        img.src = name;
    }

    img.onload = () => {
        status.textContent = '✅ ЗАГРУЖЕНО: ' + img.src.split('/').pop() + ' | Размер: ' + img.naturalWidth + 'x' + img.naturalHeight;
    };

    img.onerror = () => {
        index++;
        tryNext();
    };

    tryNext();
</script>
</body>
</html>
