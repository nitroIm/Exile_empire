<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Стратегия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = 'map_01.PNG'; // Твой файл

    // Камера (положение и зум)
    let camera = { x: 0, y: 0, zoom: 0.4 };
    let lastTouch = null;

    // Размер карты в тайлах (8 на 8 = 64 куска)
    const COLS = 8;
    const ROWS = 8;
    const TILE = 1024; // Размер одного куска

    function resize() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        draw();
    }

    function draw() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        // Изометрический наклон
        ctx.save();
        ctx.translate(w / 2 + camera.x, h / 2 + camera.y);
        ctx.rotate(Math.PI / 4);           // Поворот на 45 градусов
        ctx.scale(camera.zoom, camera.zoom * 0.5); // Сплющивание по вертикали (изометрия)

        // Центрируем карту
        const offsetX = -(COLS * TILE) / 2;
        const offsetY = -(ROWS * TILE) / 2;

        // Рисуем тайлы
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                ctx.drawImage(
                    img,
                    offsetX + c * TILE,
                    offsetY + r * TILE,
                    TILE,
                    TILE
                );
            }
        }

        ctx.restore();
    }

    // Управление пальцем
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && lastTouch) {
            camera.x += e.touches[0].clientX - lastTouch.x;
            camera.y += e.touches[0].clientY - lastTouch.y;
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            draw();
        }
    });

    canvas.addEventListener('touchend', () => { lastTouch = null; });

    img.onload = () => { resize(); };
    window.addEventListener('resize', resize);

    // Инициализация Telegram
    if (window.Telegram?.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    }
</script>
</body>
</html>
