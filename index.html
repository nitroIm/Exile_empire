<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; font-family: Arial, sans-serif; color: #fff; height: 100vh; width: 100vw; }
#splash { position: fixed; top:0; left:0; right:0; bottom:0; z-index: 100; }
#splash.hidden { display: none; }
#splash img { width: 100%; height: 100%; object-fit: cover; }
#menu { position: fixed; top:0; left:0; right:0; bottom:0; display: none; }
#menu.visible { display: block; }
#menu img.bg { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; }
#menu .dark { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); }
#menu .buttons { position: absolute; bottom: 50px; left: 0; right: 0; padding: 0 30px; }
.menu-btn { width: 100%; padding: 18px; margin-bottom: 14px; font-size: 16px; font-weight: bold; color: #fff; background: #0a1430; border: 2px solid #00e0d0; border-radius: 14px; text-align: center; }
.menu-btn.gold { border-color: #d4a020; }
#game { position: fixed; top:0; left:0; right:0; bottom:0; display: none; overflow: hidden; }
#game.visible { display: block; }
#world { position: absolute; top:0; left:0; width: 1024px; height: 1024px; }
#world img { width: 100%; height: 100%; display: block; }
#resources { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 15px; background: rgba(10,14,26,0.85); font-size: 14px; z-index: 10; }
#bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; padding: 12px; background: rgba(10,14,26,0.85); z-index: 10; }
.bottom-btn { flex: 1; padding: 14px 8px; margin: 0 4px; font-size: 12px; color: #fff; text-align: center; background: #0a1430; border: 2px solid #00e0d0; border-radius: 12px; }
.bottom-btn.gold { border-color: #d4a020; }
</style>
</head>
<body>

<div id="splash">
<img src="https://nitroIm.github.io/Exile_empire/assets/splash.PNG" alt="splash">
</div>

<div id="menu">
<img class="bg" src="https://nitroIm.github.io/Exile_empire/assets/Planet.PNG" alt="bg">
<div class="dark"></div>
<div class="buttons">
<div class="menu-btn gold" onclick="startGame()">PLAY</div>
<div class="menu-btn">PROFILE</div>
<div class="menu-btn">SHOP</div>
<div class="menu-btn">SETTINGS</div>
</div>
</div>

<div id="game">
<div id="world">
<img src="https://nitroIm.github.io/Exile_empire/maps/map_01.PNG" alt="map">
</div>
<div id="resources">
<span>METAL <span id="metal">0</span></span>
<span>CRYSTAL <span id="crystal">0</span></span>
<span>STARS <span id="stars">0</span></span>
</div>
<div id="bottom-bar">
<div class="bottom-btn gold">BUILD</div>
<div class="bottom-btn">FIGHT</div>
<div class="bottom-btn">SCIENCE</div>
<div class="bottom-btn">FLEET</div>
</div>
</div>

<!-- UI ЛОГИКА (работает всегда) -->
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

setTimeout(function() {
  document.getElementById('splash').className = 'hidden';
  document.getElementById('menu').className = 'visible';
}, 4000);

window.startGame = function() {
  document.getElementById('menu').className = '';
  document.getElementById('game').className = 'visible';
  initMapDrag();
};

function initMapDrag() {
  var world = document.getElementById('world');
  var startX = 0, startY = 0, worldX = 0, worldY = 0, drag = false;

  worldX = -(1024 - window.innerWidth) / 2;
  worldY = -(1024 - window.innerHeight) / 2;
  world.style.transform = 'translate(' + worldX + 'px, ' + worldY + 'px)';

  world.addEventListener('touchstart', function(e) {
    drag = true;
    startX = e.touches[0].clientX - worldX;
    startY = e.touches[0].clientY - worldY;
  });

  world.addEventListener('touchmove', function(e) {
    if (!drag) return;
    e.preventDefault();
    worldX = e.touches[0].clientX - startX;
    worldY = e.touches[0].clientY - startY;
    if (worldX > 0) worldX = 0;
    if (worldX < -(1024 - window.innerWidth)) worldX = -(1024 - window.innerWidth);
    if (worldY > 0) worldY = 0;
    if (worldY < -(1024 - window.innerHeight)) worldY = -(1024 - window.innerHeight);
    world.style.transform = 'translate(' + worldX + 'px, ' + worldY + 'px)';
  });

  world.addEventListener('touchend', function() { drag = false; });
}
</script>

<!-- FIREBASE (отдельно, если упадёт — игра всё равно работает) -->
<script type="module">
try {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const { getFirestore, doc, setDoc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

  const firebaseConfig = {
    apiKey: "ВСТАВЬ",
    authDomain: "ВСТАВЬ",
    projectId: "ВСТАВЬ",
    storageBucket: "ВСТАВЬ",
    messagingSenderId: "ВСТАВЬ",
    appId: "ВСТАВЬ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.loadPlayer = async function() {
    const docRef = doc(db, 'players', 'test_user_1');
    const snap = await getDoc(docRef);
    if (snap.exists()) {
      const d = snap.data();
      document.getElementById('metal').textContent = d.metal || 0;
      document.getElementById('crystal').textContent = d.crystal || 0;
      document.getElementById('stars').textContent = d.stars || 0;
    } else {
      await setDoc(docRef, { metal: 500, crystal: 200, stars: 0 });
      document.getElementById('metal').textContent = 500;
      document.getElementById('crystal').textContent = 200;
      document.getElementById('stars').textContent = 0;
    }
  };
} catch(e) {
  console.log('Firebase fail:', e);
}
</script>

</body>
</html>
