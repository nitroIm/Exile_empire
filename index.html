<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; font-family: -apple-system, sans-serif; color: #fff; height: 100vh; width: 100vw; }

#splash { position: fixed; inset: 0; z-index: 100; }
#splash.hidden { display: none; }
#splash img { width: 100%; height: 100%; object-fit: cover; }

#menu { position: fixed; inset: 0; display: none; }
#menu.visible { display: block; }
#menu img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#menu .dark { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%); }
#menu .buttons { position: absolute; bottom: 50px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; padding: 0 30px; z-index: 5; }

.menu-btn {
  width: 100%; max-width: 320px; padding: 18px; margin-bottom: 14px;
  font-size: 16px; letter-spacing: 2px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #0a1430, #102850);
  border: 2px solid #00e0d0; border-radius: 14px; text-align: center;
}
.menu-btn.gold { border-color: #d4a020; }

#game { position: fixed; inset: 0; display: none; }
#resources {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-around;
  padding: 15px; background: rgba(10,14,26,0.85);
  font-size: 14px; z-index: 10;
}
</style>
</head>
<body>

<div id="splash">
  <img src="assets/splash.PNG">
</div>

<div id="menu">
  <img class="bg" src="assets/Planet.PNG">
  <div class="dark"></div>
  <div class="buttons">
    <div class="menu-btn gold" onclick="startGame()">▶ PLAY</div>
    <div class="menu-btn">PROFILE</div>
    <div class="menu-btn">SHOP</div>
    <div class="menu-btn">SETTINGS</div>
  </div>
</div>

<div id="game">
  <div id="resources">
    <span>🪙 <span id="metal">0</span></span>
    <span>💎 <span id="crystal">0</span></span>
    <span>⭐ <span id="stars">0</span></span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ВСТАВЬ СВОИ КЛЮЧИ ИЗ FIREBASE ВМЕСТО ЭТИХ
const firebaseConfig = {
  apiKey: "AIzaSyAaAMt8O1pNfF7O2TJkWSyyvv6Ndp5XHfU",
  authDomain: "exile-empire.firebaseapp.com",
  projectId: "exile-empire",
  storageBucket: "exile-empire.firebasestorage.app",
  messagingSenderId: "465765692374",
  appId: "1:465765692374:web:c6b984f3ba91ecc22c2a77",
  measurementId: "G-8V3KZSNLM1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('menu').classList.add('visible');
  }, 3000);
});

window.startGame = async function() {
  document.getElementById('menu').classList.remove('visible');
  document.getElementById('game').style.display = 'block';

  const playerId = 'test_user_1';
  const docRef = doc(db, 'players', playerId);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    const data = docSnap.data();
    document.getElementById('metal').textContent = data.metal || 0;
    document.getElementById('crystal').textContent = data.crystal || 0;
    document.getElementById('stars').textContent = data.stars || 0;
  } else {
    await setDoc(docRef, { metal: 500, crystal: 200, stars: 0 });
    document.getElementById('metal').textContent = 500;
    document.getElementById('crystal').textContent = 200;
  }
};
</script>
</body>
</html>
