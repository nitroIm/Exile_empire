<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Exile Empire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; overflow: hidden; height: 100vh; width: 100vw; }

#splash {
  position: fixed; inset: 0;
}
#splash img {
  width: 100%; height: 100%; object-fit: cover;
}

/* ЗАГРУЗЧИК — отдельно, мигает */
#loader {
  position: fixed;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  max-width: 420px;
  z-index: 10;
  animation: pulse 1.5s ease-in-out infinite;
}
#loader img {
  width: 100%; height: auto; display: block;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; filter: brightness(0.7); }
  50%      { opacity: 1;   filter: brightness(1.3); }
}
</style>
</head>
<body>

<div id="splash">
  <img src="assets/splash.PNG" alt="Exile Empire">
</div>

<div id="loader">
  <img src="assets/bar.png" alt="loading">
</div>

</body>
</html>
